            background-color: #4d1a1a !important;
            border-color: #7a2d2d !important;
            color: #ff6b6b !important;
        }

        }

            padding: 18px;
            background: #242424;
            border-radius: 8px;
            display: none;
        }

        }

            font-size: 12px;
            text-transform: uppercase;

            color: #ddd;

            font-weight: bold;

            padding: 8px;

            color: #90ee90;

            background: #4d1a1a;
            color: #ff6b6b;
        }

            text-align: center;
            color: #999;
            margin: 20px 0;
            font-size: 13px;

            justify-content: center;

            align-items: center;
            margin-top: 25px;

            color: #ddd;

        // State variables
        let currentIndex = 0;
        let answered = false;
        let correctCount = 0;
        let incorrectCount = 0;

        /**
         * Render the current flashcard
         */
        function render() {
            const card = flashcardData[currentIndex];
            document.getElementById('question').textContent = card.q;
            document.getElementById('count').textContent = `${currentIndex + 1} of ${flashcardData.length}`;
            document.getElementById('fill').style.width = `${((currentIndex + 1) / flashcardData.length) * 100}%`;
            document.getElementById('scoreDisplay').textContent = `Correct: ${correctCount} | Incorrect: ${incorrectCount}`;
            document.getElementById('score-badge').textContent = `Score: ${correctCount}/${correctCount + incorrectCount}`;
            
            const optionsContainer = document.getElementById('options');
            optionsContainer.innerHTML = '';
            answered = false;
            document.getElementById('answerDisplay').classList.remove('show');

            card.options.forEach((option, index) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.textContent = `${String.fromCharCode(65 + index)}. ${option}`;
                btn.onclick = () => selectOption(index);
                optionsContainer.appendChild(btn);
            });
        }

        /**
         * Handle option selection
         */
        function selectOption(index) {
            if (answered) return;

            answered = true;
            const card = flashcardData[currentIndex];
            const buttons = document.querySelectorAll('.option-btn');
            const isCorrect = index === card.answer;

            buttons.forEach((btn, i) => {
                btn.disabled = true;
                if (i === card.answer) {
                    btn.classList.add('correct');
                } else if (i === index && !isCorrect) {
                    btn.classList.add('incorrect');
                }
            });

            if (isCorrect) {
                correctCount++;
            } else {
                incorrectCount++;
            }

            // Show answer
            const answerDisplay = document.getElementById('answerDisplay');
            const resultMessage = document.getElementById('resultMessage');
            resultMessage.innerHTML = isCorrect 
                ? '<div class="result-message result-correct">✓ Correct!</div>'
                : '<div class="result-message result-incorrect">✗ Incorrect!</div>';
            document.getElementById('answerText').textContent = card.fullAnswer;
            answerDisplay.classList.add('show');

            document.getElementById('scoreDisplay').textContent = `Correct: ${correctCount} | Incorrect: ${incorrectCount}`;
            document.getElementById('score-badge').textContent = `Score: ${correctCount}/${correctCount + incorrectCount}`;
        }

        /**
         * Move to next card
         */
        function next() {
            currentIndex = (currentIndex + 1) % flashcardData.length;
            render();
        }

        /**
         * Move to previous card
         */
        function prev() {
            currentIndex = (currentIndex - 1 + flashcardData.length) % flashcardData.length;
            render();
        }

        /**
         * Shuffle cards and reset tracking
         */
        function shuffle() {
            for (let j = flashcardData.length - 1; j > 0; j--) {
                const k = Math.floor(Math.random() * (j + 1));
                [flashcardData[j], flashcardData[k]] = [flashcardData[k], flashcardData[j]];
            }
            currentIndex = 0;
            correctCount = 0;
            incorrectCount = 0;
            render();
        }

        /**
         * Keyboard shortcuts
         */
        document.addEventListener('keydown', (event) => {
            if (!answered) {
                // Number keys 1-4 for selecting options
                if (event.key >= '1' && event.key <= '4') {
                    const index = parseInt(event.key) - 1;
                    if (index < flashcardData[currentIndex].options.length) {
                        selectOption(index);
                    }
                }
            }
            if (event.key === 'ArrowRight') {
                next();
            }
            if (event.key === 'ArrowLeft') {
                prev();
            }
        });

        // Initialize on page load with randomized question order
        shuffle();
